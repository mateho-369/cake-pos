; Production OPcache. php:8.4-fpm-alpine ships with the extension OFF.
; validate_timestamps=0 means bytecode is never rechecked on disk — every
; deploy MUST recreate the app/queue containers or they will keep serving
; the previous image's compiled files.
opcache.enable=1
opcache.enable_cli=0
opcache.validate_timestamps=0
; Container RAM is tight (see docker-compose memory limits). 64MB is enough
; for this codebase; 128MB would starve php-fpm on the 256MB app limit.
opcache.memory_consumption=64
opcache.max_accelerated_files=20000
opcache.interned_strings_buffer=16
opcache.revalidate_freq=0
