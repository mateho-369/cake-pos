; The base php:8.4-fpm-alpine image ships no php.ini at all (only the
; php.ini-production/-development templates, neither of which is copied by
; the Dockerfile), so PHP falls back to its compiled-in engine defaults —
; display_errors=On among them. That let a stray PHP warning
; ("use statement with non-compound name 'Throwable' has no effect") render
; directly into the body of /api/reports/dashboard ahead of the JSON,
; breaking strict JSON parsing for any real client. Errors still get
; reported and logged; they just never render into an HTTP response body.
error_reporting = E_ALL
display_errors = Off
log_errors = On
