services:
    mysql:
        image: mysql:8.4
        restart: unless-stopped
        environment:
            MYSQL_DATABASE: ${DB_DATABASE}
            MYSQL_USER: ${DB_USERNAME}
            MYSQL_PASSWORD: ${DB_PASSWORD}
            MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
        volumes:
            - mysql-data:/var/lib/mysql
        command: ['--innodb-buffer-pool-size=128M', '--max-connections=50']
        healthcheck:
            test:
                [
                    'CMD-SHELL',
                    'mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent',
                ]
            interval: 10s
            timeout: 5s
            retries: 12
        deploy:
            resources:
                limits:
                    memory: 384M

    minio:
        image: minio/minio:RELEASE.2025-04-22T22-12-26Z
        restart: unless-stopped
        env_file: .env
        command: server /data --console-address ":9001"
        ports:
            - '127.0.0.1:${MINIO_API_PORT:-9000}:9000'
            - '127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001'
        volumes:
            - minio-data:/data
        healthcheck:
            test:
                ['CMD', 'curl', '-f', 'http://127.0.0.1:9000/minio/health/live']
            interval: 10s
            timeout: 5s
            retries: 12
        deploy:
            resources:
                limits:
                    memory: 256M

    minio-init:
        image: minio/mc:RELEASE.2025-04-16T18-13-26Z
        env_file: .env
        depends_on:
            minio:
                condition: service_healthy
        restart: 'no'
        entrypoint: ['/bin/sh', '-c']
        volumes:
            - ./docker/minio-cors.xml:/config/minio-cors.xml:ro
        command:
            - >-
                mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" &&
                mc mb --ignore-existing "local/$${MINIO_BUCKET}" &&
                mc anonymous set download "local/$${MINIO_BUCKET}/product-images" &&
                mc cors set "local/$${MINIO_BUCKET}" /config/minio-cors.xml

    app:
        build: .
        restart: unless-stopped
        env_file: .env
        depends_on:
            mysql:
                condition: service_healthy
            minio:
                condition: service_healthy
            minio-init:
                condition: service_completed_successfully
        deploy:
            resources:
                limits:
                    memory: 192M

    migrate:
        build: .
        profiles: ['tools']
        env_file: .env
        depends_on:
            mysql:
                condition: service_healthy
        restart: 'no'
        entrypoint: ['/bin/sh', '-lc']
        command:
            - >-
                php artisan migrate --force && php artisan db:seed --force

    web:
        image: nginx:1.27-alpine
        restart: unless-stopped
        depends_on: [app]
        ports:
            - '${PORT:-8080}:8080'
        volumes:
            - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
            - ./public:/var/www/html/public:ro
        deploy:
            resources:
                limits:
                    memory: 64M

volumes:
    mysql-data:
    minio-data:
