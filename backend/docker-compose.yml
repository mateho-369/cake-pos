services:
    app:
        build:
            context: .
            args:
                CACHEBUST: ${CACHEBUST:-1}
        restart: unless-stopped
        env_file: .env
        deploy:
            resources:
                limits:
                    memory: 192M

    queue:
        build:
            context: .
            args:
                CACHEBUST: ${CACHEBUST:-1}
        restart: unless-stopped
        env_file: .env
        command: ['php', 'artisan', 'queue:work', '--sleep=3', '--tries=3']
        deploy:
            resources:
                limits:
                    memory: 128M

    migrate:
        build:
            context: .
            args:
                CACHEBUST: ${CACHEBUST:-1}
        profiles: ['tools']
        env_file: .env
        restart: 'no'
        entrypoint: ['/bin/sh', '-lc']
        command:
            - >-
                php artisan migrate --force && php artisan db:seed --force

    web:
        image: nginx:1.27-alpine
        restart: unless-stopped
        depends_on: [app]
        ports:
            - '${PORT:-8080}:8080'
        volumes:
            - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
            - ./public:/var/www/html/public:ro
        deploy:
            resources:
                limits:
                    memory: 64M
