name: Deploy Frontends to Cloudflare

on:
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'packages/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [admin, sale, shop, api-proxy]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - name: Build (skip for api-proxy, no build step needed)
        if: matrix.app != 'api-proxy'
        run: npm run build --workspace=apps/${{ matrix.app }}
      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/${{ matrix.app }}
          command: deploy
