# ── Local development stack ──────────────────────────────────────────────────
# Phase 1: the React apps run via `npm run dev` (Vite on :5173).
# MySQL + MinIO are here so the Laravel API can drop in without re-learning
# the portfolio bugs. `app` / nginx are omitted until Laravel is requested.
#
# Start data services: docker compose up --build -d
# Frontend:            npm run dev

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: cake_pos
      MYSQL_USER: cake_pos
      MYSQL_PASSWORD: cake_pos
      MYSQL_ROOT_PASSWORD: local-mysql-root-password
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: bloom
      MINIO_ROOT_PASSWORD: local-minio-password
      MINIO_API_CORS_ALLOW_ORIGIN: "*"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 15

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    # YAML list — never a bare multi-line string under command: (portfolio bug #1)
    command:
      - >-
        mc alias set local http://minio:9000 bloom local-minio-password &&
        mc mb --ignore-existing local/cake-pos &&
        mc anonymous set download local/cake-pos/products

volumes:
  mysql-data:
  minio-data:
