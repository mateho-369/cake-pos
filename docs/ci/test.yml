name: Test

on:
  push:
    branches: [main, 'arena/**']
  workflow_dispatch: {}

jobs:
  # ============================================================
  # REAL backend: PHP 8.3 + MySQL 8.4 + MinIO, full API lifecycle
  # ============================================================
  backend-e2e:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: cake_pos
          MYSQL_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval 5s --health-timeout 5s --health-retries 20
      minio:
        image: minio/minio
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
        ports: ['9000:9000']
        options: >-
          --health-cmd "curl -f http://localhost:9000/minio/health/live"
          --health-interval 5s --health-timeout 5s --health-retries 20
        command: server /data
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, xml, curl, pdo_mysql, bcmath, zip, gd, intl, exif, fileinfo
          coverage: none

      - name: Verify MySQL timezone tables (CONVERT_TZ dependency)
        run: |
          mysql -h127.0.0.1 -uroot -proot -N -e "SELECT CONVERT_TZ(NOW(),'UTC','Asia/Phnom_Penh');" || echo "TZ check failed"
          mysql -h127.0.0.1 -uroot -proot -N -e "SELECT COUNT(*) FROM mysql.time_zone_name;" 

      - name: Composer install
        working-directory: backend
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Configure .env (production-like, matching deploy)
        working-directory: backend
        run: |
          php artisan key:generate --force
          cat >> .env <<'EOF'
          DB_CONNECTION=mysql
          DB_HOST=127.0.0.1
          DB_PORT=3306
          DB_DATABASE=cake_pos
          DB_USERNAME=root
          DB_PASSWORD=root
          ADMIN_ORIGIN=http://localhost:4173
          SALE_ORIGIN=http://localhost:4174
          SHOP_ORIGIN=http://localhost:4175
          # REAL queue verification: the notification must survive the full
          # MySQL jobs table -> `queue:work` process -> HTTP POST path, so
          # nothing is allowed to run inline (sync) here.
          QUEUE_CONNECTION=database
          FILESYSTEM_DISK=s3
          AWS_ACCESS_KEY_ID=minioadmin
          AWS_SECRET_ACCESS_KEY=minioadmin
          AWS_DEFAULT_REGION=us-east-1
          AWS_BUCKET=cake-pos
          AWS_ENDPOINT=http://127.0.0.1:9000
          AWS_PUBLIC_ENDPOINT=http://127.0.0.1:9000
          AWS_URL=http://127.0.0.1:9000/cake-pos
          SHOP_TELEGRAM_BOT_TOKEN=123:test-token
          # Staff notifications are pointed at the local Telegram API stub
          # started by backend/tests/e2e/queue-verify.sh.
          STAFF_TELEGRAM_BOT_TOKEN=123:staff-ci-token
          STAFF_NOTIFICATION_CHAT_ID=424242
          TELEGRAM_API_BASE=http://127.0.0.1:8090
          EOF
          grep -E 'APP_ENV|DB_|ADMIN_ORIGIN|QUEUE_' .env | head -20

      - name: Migrate + seed (db:seed --force, exactly like production)
        working-directory: backend
        run: |
          php artisan migrate --force
          php artisan db:seed --force

      - name: Serve the API on :8080
        working-directory: backend
        run: |
          nohup php artisan serve --host=127.0.0.1 --port=8080 > /tmp/serve.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8080/healthz && break; sleep 1; done
          curl -sS http://127.0.0.1:8080/healthz

      - name: Backend API lifecycle smoke test (real HTTP requests)
        run: |
          chmod +x backend/tests/e2e/smoke.sh
          API_URL=http://127.0.0.1:8080 bash backend/tests/e2e/smoke.sh

      - name: Queued staff notification reaches Telegram (real DB queue + worker)
        env:
          API_URL: http://127.0.0.1:8080
        run: |
          chmod +x backend/tests/e2e/queue-verify.sh
          bash backend/tests/e2e/queue-verify.sh

      - name: PHPUnit contract test suite
        working-directory: backend
        run: php artisan test

  # ============================================================
  # Frontends: typecheck + production build + real export files
  # ============================================================
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - name: Typecheck all apps
        run: npm run typecheck
      - name: Unit tests (dual-currency math, exports, Telegram Mini App chrome)
        run: node e2e/unit/unit-tests.mjs
      - name: Locale parity (every en/km key resolves)
        run: node e2e/locale-audit.mjs
      - name: Production build (same env as deploy)
        run: npm run build
        env:
          VITE_API_URL: https://g-cake-api.system-app.workers.dev
      - name: Verify real export files (xlsx/docx/csv generated by app code)
        run: node e2e/exports-verify/verify.mjs

  # ============================================================
  # REAL UI: headless Chromium against real backend + built apps
  # ============================================================
  ui:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: cake_pos
          MYSQL_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval 5s --health-timeout 5s --health-retries 20
      minio:
        image: minio/minio
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
        ports: ['9000:9000']
        options: >-
          --health-cmd "curl -f http://localhost:9000/minio/health/live"
          --health-interval 5s --health-timeout 5s --health-retries 20
        command: server /data
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, xml, curl, pdo_mysql, bcmath, zip, gd, intl, exif, fileinfo
      - name: Composer install
        working-directory: backend
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Configure .env
        working-directory: backend
        run: |
          php artisan key:generate --force
          cat >> .env <<'EOF'
          DB_CONNECTION=mysql
          DB_HOST=127.0.0.1
          DB_PORT=3306
          DB_DATABASE=cake_pos
          DB_USERNAME=root
          DB_PASSWORD=root
          ADMIN_ORIGIN=http://localhost:4173
          SALE_ORIGIN=http://localhost:4174
          SHOP_ORIGIN=http://localhost:4175
          QUEUE_CONNECTION=sync
          FILESYSTEM_DISK=s3
          AWS_ACCESS_KEY_ID=minioadmin
          AWS_SECRET_ACCESS_KEY=minioadmin
          AWS_DEFAULT_REGION=us-east-1
          AWS_BUCKET=cake-pos
          AWS_ENDPOINT=http://127.0.0.1:9000
          AWS_PUBLIC_ENDPOINT=http://127.0.0.1:9000
          AWS_URL=http://127.0.0.1:9000/cake-pos
          SHOP_TELEGRAM_BOT_TOKEN=123:test-token
          EOF
      - name: Migrate + seed
        working-directory: backend
        run: |
          php artisan migrate --force
          php artisan db:seed --force
          nohup php artisan serve --host=127.0.0.1 --port=8080 > /tmp/serve.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8080/healthz && break; sleep 1; done
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - name: Build apps against the local backend
        run: |
          VITE_API_URL=http://127.0.0.1:8080 npm run build --workspace=@cake-pos/admin
          VITE_API_URL=http://127.0.0.1:8080 npm run build --workspace=@cake-pos/sale
          VITE_API_URL=http://127.0.0.1:8080 npm run build --workspace=@cake-pos/shop
      - name: Serve built apps
        run: |
          nohup python3 -m http.server 4173 --directory apps/admin/dist > /tmp/admin.log 2>&1 &
          nohup python3 -m http.server 4174 --directory apps/sale/dist > /tmp/sale.log 2>&1 &
          nohup python3 -m http.server 4175 --directory apps/shop/dist > /tmp/shop.log 2>&1 &
          sleep 2
          curl -sf http://localhost:4173/ >/dev/null && echo "admin up"
          curl -sf http://localhost:4174/ >/dev/null && echo "sale up"
          curl -sf http://localhost:4175/ >/dev/null && echo "shop up"
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: Drive admin/sale/shop in headless Chromium
        env:
          API_URL: http://127.0.0.1:8080
          ADMIN_URL: http://localhost:4173
          SALE_URL: http://localhost:4174
          SHOP_URL: http://localhost:4175
          BOT_TOKEN: '123:test-token'
        run: node e2e/ui/ui-smoke.mjs
      - name: Mobile responsive audit (390px + 360px phone viewports)
        env:
          API_URL: http://127.0.0.1:8080
          ADMIN_URL: http://localhost:4173
          SALE_URL: http://localhost:4174
        run: node e2e/ui/mobile-audit.mjs
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: e2e/ui/artifacts

  # ============================================================
  # LIVE PRODUCTION probes (read-only + shift lifecycle w/ cleanup)
  # ============================================================
  live-prod:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe live production API
        env:
          WORKER_URL: https://g-cake-api.system-app.workers.dev
          VM_URL: http://34.9.115.19:8080
        run: bash backend/tests/e2e/live-prod.sh
